# Local development stack: API + PostgreSQL.
# Copy .env.example to .env first and set your own password. .env is git-ignored.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimguard
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only, never exposed to your network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClaimGuard: "Host=db;Port=5432;Database=claimguard;Username=claimguard;Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  pgdata:
